l_english:
 LFB_COX_Europe_Checkbox_tt:0 "§YEuropean News§!\nComrades in the north — are you ready to break these chains together with us?\n\n§RThe Xinjiang Soviet cannot stop receiving European news.§!"
 LFB_COX_Asia_Checkbox_tt:0 "§YAsian News§!\nEven the whispers of enemies and collaborators do not escape our ears.\n\n§RThe Xinjiang Soviet cannot stop receiving Asian news.§!"
 LFB_COX_America_Checkbox_ticked_tt:0 "§YAmerican News§!\nOn the far side of the world embers are stirring; a turning point may hide among them.\n\n§gClick to unsubscribe.§!"
 LFB_COX_America_Checkbox_unticked_tt:0 "§YAmerican News§!\nNever mind. That kind of make-believe revolution is child's play.\n\n§gClick to subscribe again.§!"
 LFB_COX_Africa_Checkbox_ticked_tt:0 "§YAfrican News§!\nThe dark continent still labours under the jackboot; every cry there shares our frequency.\n\n§gClick to unsubscribe.§!"
 LFB_COX_Africa_Checkbox_unticked_tt:0 "§YAfrican News§!\nAcross the sands of the Sahara, that continent's weeping sounds too distant.\n\n§gClick to subscribe again.§!"
 LFB_COX_Oceania_Checkbox_ticked_tt:0 "§YPacific News§!\nThe old empires are receding and no new wave has formed — those islands will change flags sooner or later.\n\n§gClick to unsubscribe.§!"
 LFB_COX_Oceania_Checkbox_unticked_tt:0 "§YPacific News§!\nAcross the ocean, we cannot even pronounce the names of those islands.\n\n§gClick to subscribe again.§!"
 LFB_COX_Antarctica_Checkbox_ticked_tt:0 "§YAntarctic News§!\nThe scramble over the ice is absurd yet real; the end of the world is also betting on the future.\n\n§gClick to unsubscribe.§!"
 LFB_COX_Antarctica_Checkbox_unticked_tt:0 "§YAntarctic News§!\nThere is only ice, penguins, and the ambition of a few madmen.\n\n§gClick to subscribe again.§!"
 LFB_XBJ_Europe_Checkbox_ticked_tt:0 "§YEuropean News§!\nEvery telegram from Europe is worth filing — it decides how long we may still breathe.\n\n§gClick to unsubscribe.§!"
 LFB_XBJ_Europe_Checkbox_unticked_tt:0 "§YEuropean News§!\nEurope is far away. Finish the business in Lanzhou first.\n\n§gClick to subscribe again.§!"
 LFB_XBJ_Asia_Checkbox_ticked_tt:0 "§YAsian News§!\nAsia is our flank; every rustle of movement belongs in the files.\n\n§gClick to unsubscribe.§!"
 LFB_XBJ_Asia_Checkbox_unticked_tt:0 "§YAsian News§!\nIgnoring it hardly helps — a neighbour's knife is heard through the wall.\n\n§gClick to subscribe again.§!"
 LFB_XBJ_America_Checkbox_ticked_tt:0 "§YAmerican News§!\nEvery election in Washington becomes, years later, a rifle on our border.\n\n§gClick to unsubscribe.§!"
 LFB_XBJ_America_Checkbox_unticked_tt:0 "§YAmerican News§!\nA game played across the whole Pacific need not be copied out line by line.\n\n§gClick to subscribe again.§!"
 LFB_XBJ_Africa_Checkbox_ticked_tt:0 "§YAfrican News§!\nThe colonial chains are loosening; a pity our reach is not yet that long.\n\n§gClick to unsubscribe.§!"
 LFB_XBJ_Africa_Checkbox_unticked_tt:0 "§YAfrican News§!\nAfrica's accounts are kept in other people's ledgers.\n\n§gClick to subscribe again.§!"
 LFB_XBJ_Oceania_Checkbox_ticked_tt:0 "§YPacific News§!\nThe island chain is both Japan's backyard and the rope around its neck.\n\n§gClick to unsubscribe.§!"
 LFB_XBJ_Oceania_Checkbox_unticked_tt:0 "§YPacific News§!\nThe Pacific is far; our maps still hold only the northwest corner.\n\n§gClick to subscribe again.§!"
 LFB_XBJ_Antarctica_Checkbox_ticked_tt:0 "§YAntarctic News§!\nEven Antarctic stations fly flags, and behind flags there is money.\n\n§gClick to unsubscribe.§!"
 LFB_XBJ_Antarctica_Checkbox_unticked_tt:0 "§YAntarctic News§!\nThere is nothing under the ice sheet that we need.\n\n§gClick to subscribe again.§!"
