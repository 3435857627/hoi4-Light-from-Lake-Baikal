l_english:
 LFB_IF_PRC.1645.t:0 "[Get_newspaper_header]The Northeast Has New Masters"
 LFB_IF_PRC.1645.desc:0 "When word of Chengde's fall arrived, Tokyo's language was harsher than ever: the Sphere accused China of arming rebels and subverting the Manchurian order, and demanded an immediate explanation.\n\nThe facts were plainer than any excuse - the men who had come out of the forests and snows now had a name of their own: the Northeast People's Liberation Army. Their delegates announced in Chengde that the Reconstruction Committee of West Manchuria was dissolved and all authority passed to the Northeast Bureau of the CPC Central Committee.\n\nPort Arthur's reply was only a few words: this is the choice of the Northeast's own people. As for how long Manchukuo's signboard could still hang, no one wished to answer in that telegram."
 LFB_IF_PRC.1645.a:0 "Let the Northeast return to the people."
 LFB_IF_PRC.1645.b:0 "These barbarians dare..."
 LFB_IF_PRC.1645.c:0 "East Asia has been rewritten once again."
