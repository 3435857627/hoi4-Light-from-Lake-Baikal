l_english:
 LFB_NE.1.t:0 "The End of Manchuria"
 LFB_NE.1.d:0 "The morning the Kwantung Army's flag came down, Tokyo's telegram arrived as well: the Sphere accepted that Manchuria could no longer be held, and was willing to cease fire on the spot.\n\nAt the table the Japanese delegates put it politely - 'to avoid greater bloodshed'. Everyone understood what that meant: there was no second Kwanting Army left to send.\n\nThe signboard of Manchukuo still hangs. But everyone knows there is nothing behind it anymore. In West Manchuria the comrades wait outside the city to take over; everything has been agreed, and only the guns have yet to fall silent."
 LFB_NE.1.a:0 "This is where it ends."
