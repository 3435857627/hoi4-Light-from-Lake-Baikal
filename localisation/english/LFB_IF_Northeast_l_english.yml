l_english:
 LFB_NE.1.t:0 "The End of Manchuria"
 LFB_NE.1.d:0 "The guns outside Shenyang fell silent at dawn, and the Kwantung Army's flag was already gone.\n\nTokyo's telegram arrived sooner than expected: the Sphere would accept that Manchuria could no longer be held, and was willing to cease fire on the spot. At the table the Japanese delegates put it politely - 'to avoid greater bloodshed' - and everyone understood what that really meant: there was no second Kwantung Army left to send.\n\nThe signboard of Manchukuo still hangs. But everyone can see there is nothing behind it anymore. In West Manchuria the comrades met through the night, and what they argued about was no longer whether to take over, but what to call themselves afterwards."
 LFB_NE.1.a:0 "This is where it ends."
