l_simp_chinese:
 # ===== COX_red_army =====
 SUBDOCTRINE_COX_RED_ARMY: "工农红军"
 SUBDOCTRINE_COX_RED_ARMY_DESC: "新疆的工业无法为军队提供坦克、火炮与飞机，工农红军因此不追求与对手对等的装备，也无法在数量上压倒对手，唯一能依靠的是人的判断：对战略处境的把握、对敌军动向的分析，乃至每一个基层士兵的急中生智。装备上的差距不会消失，只能靠策略与战法来弥补。"
 COX_red_army_sanwan_reorganization: "乌鲁木齐改编"
 COX_red_army_sanwan_reorganization_desc: "新生的工农红军构成繁杂：刚分到土地的农民、原军阀部队的职业军官，以及语言和生活习惯都不相同的各民族士兵。这些互不熟悉的人第一次在同一面旗帜下作战。磨合远未完成，但部队第一次有了统一的指挥。"
 COX_red_army_party_branch_in_company: "政务军官"
 COX_red_army_party_branch_in_company_desc: "政委被派驻到连一级，他们是热情洋溢的年轻知识分子。除宣传之外，他们更实际的职责是掌握部队的真实状况，并在战斗中维持指挥的连续性。对新兵与旧军官混编的部队来说，政委是部队的粘合剂，是维系纪律与战斗力的关键。"
 COX_red_army_officers_and_men_alike: "官兵平等"
 COX_red_army_officers_and_men_alike_desc: "在工农红军中，军官与士兵的待遇差别被压到最低，彼此以“指挥员”与“战斗员”相称。待遇平等让士兵愿意承担风险，也让基层的战术建议有渠道上达。装备处于劣势时，士兵在战场上的临机判断往往比上级的命令更有价值，我们相信能发扬这种判断力的军队将远胜等级森严的旧军队。"
 COX_red_army_three_rules_eight_notices: "知己知彼"
 COX_red_army_three_rules_eight_notices_desc: "中国旅的老兵在苏联见过现代战争的样子——在西俄罗斯，他们曾直面德军的锋锐，他们与世界上最强大的军队战斗的故事，早已传遍全军。我们的装备依旧简陋，但了解这些战争的模样，就能让前线指挥官在最激烈的战场保持清醒的判断，让新兵不至于被敌人貌似的强大削弱意志。清楚敌人的强项，是以弱胜强的第一步。"
 COX_red_army_spark_starts_prairie_fire: "凤凰涅槃"
 COX_red_army_spark_starts_prairie_fire_desc: "在战火淬炼之后，工农红军已积累了许多经验。我们鼓励下级在战场上自行判断、抓住战机，而不是等待命令。工农红军不再是只能依靠数量和牺牲作战的部队——在轻步兵中，它足以与任何最强大的军队匹敌。"
 # ===== COX_harassment_sabotage =====
 SUBDOCTRINE_COX_HARASSMENT_SABOTAGE: "袭扰破坏"
 SUBDOCTRINE_COX_HARASSMENT_SABOTAGE_DESC: "敌人装备精良，我们缺枪少弹，正面交锋只会把差距放大。袭扰破坏的全部意义在于选择战场：避开敌人的强点，打击其交通、补给与指挥，用时间和地形换取局部的兵力优势。破坏小组汇聚了军中最灵活的头脑，他们无法与装甲部队相抗衡，但能令敌人在抵达战场之前就失去燃料、道路和方向。"
 COX_harassment_sabotage_railway_sabotage: "要道伏击"
 COX_harassment_sabotage_railway_sabotage_desc: "我们熟悉本地地形，知道哪些路段无法展开，哪些隘口只能单车通过。伏击的目标是扰乱敌人的行军，摧毁进军的协调性。待到敌人终于调集兵力反击之时，破坏小组早已撤离，仅留下被炸毁的车辆封堵前路。"
 COX_harassment_sabotage_mine_warfare: "诱敌深入"
 COX_harassment_sabotage_mine_warfare_desc: "面对远弱于自己的对手，敌人的指挥官往往带着一种傲慢进入战场，把我们视作一触即溃的乌合之众。这种判断可以被利用：主动放弃一些地方，让敌人以为我们在溃退，把他们的纵队拉长、补给线拖远，然后在不利于他们的地形上接战。"
 COX_harassment_sabotage_sparrow_warfare: "地道作战"
 COX_harassment_sabotage_sparrow_warfare_desc: "地道与坎儿井、村落和戈壁连成网络。敌人可以占领地面，却无法控制地下。地道战的威胁不在于杀伤，而在于不确定性：任何一处无人的村落地下都可能有伏兵，仅是这个可能，就能让敌人在踏上我们的土地前三思而后行。"
 COX_harassment_sabotage_tunnel_warfare: "小规模袭扰"
 COX_harassment_sabotage_tunnel_warfare_desc: "总攻之前，我们用密集的小规模袭扰打乱敌人的判断。三五人一组的袭击不会造成多大伤亡，却能迫使敌人分散兵力、加强警戒、消耗弹药与精力。当敌人的注意力被这些袭击牵住，我们真正的部署才有展开的时间。"
 COX_harassment_sabotage_interdict_communications: "密集夜袭"
 COX_harassment_sabotage_interdict_communications_desc: "夜战能在很大程度上抹平装备差距：夜视器材有限的一方，在黑暗中与对手面临同样的困难。总攻时，我们会在夜间集中兵力抵近，用刺刀与炸药包解决战斗。目的不是杀伤，而是在近距离上瓦解敌人的组织与意志。"
