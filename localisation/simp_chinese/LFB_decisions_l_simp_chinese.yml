 red_Guards_aa:0 "赤卫队防空武器配发"
 COX_Assign_commanders_and_fighters_desc:0 "新组建的红军缺乏训练，好在新疆并不缺乏老兵。无论出身八十八旅还是盛世才时的边防部队，这些丰富的指战员一旦进入行伍，便能身体力行地传授许多经验。"
 COX_Organize_large_scale_military_training_desc:0 "抽调精锐部队组织一次贴近实战的演训，能令我们的指战员熟悉自身的优势与弱点，从中演绎出适合于我军的战法，必然将令全军受益匪浅。"
 COX_Establish_equal_relations_between_commanders_and_fighters_desc:0 "自井冈山起义以来，官兵平等就是红军骄傲的传统，旧军队中森严的等级制被完全废弃，取而代之的是一支没有军衔之分，没有待遇差异的革命军。新生的红军应当继承这个传统，让军队成为新社会的播种机，宣传队。"
 COX_Organizational_democratization_desc:0 "在推行官兵待遇平等后，我们还应更进一步，推动军队指挥体系的民主化——这并不意味着废除指挥链，而是鼓励连队建立一套更灵活的机制。与死板的旧军队相反，我军中的一线士兵被鼓励发挥能动性，积极找寻并打击敌人的破绽。"
 COX_Popularize_guerrilla_warfare_and_carry_forward_mobile_warfare_desc:0 "红军历史上从来不缺少以弱胜强的战例，从建军伊始，先烈们就以劣势兵力与更差的装备对抗优于己身的敌人。我们军队最宝贵的战术思想是运动战与游击战，而它们的娴熟运用要求极高的战术素养——毕竟一个新兵或许能勉强坚守战壕，却经常在频繁的战术机动中掉队。在真正的战争到来之前，我们必须加强相关训练。"
 COX_Mobilize_militia_to_strengthen_border_defense_desc:0 "西伯利亚的土匪流寇始终是北疆挥之不去的阴霾，在土改过程中，各个聚居点都建立起了自保力量。我们可以为他们提供武器，教授他们如何利用盛世才留下的哨塔与碉楼，更进一步，这些力量可以被组织起来，形成一支机动兵力，足以压倒任何试图越境的势力，彻底确保北疆无忧。"
 COX_New_army_new_look_desc:0 "从俄罗斯归来的游子；辗转战斗二十余年的老兵；刚刚得到解放的农奴……这些迥异的人构成了崭新的工农红军，他们洋溢着昂扬的激情，准备迈向新的战场。"
 COX_organize_training_mastery:0 "组织大练兵"
