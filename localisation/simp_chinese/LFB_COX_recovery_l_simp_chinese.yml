 COX_Rec_Continue_Hami_Aksu_Railway:0 "继续哈密-阿克苏铁路"
 COX_Rec_Continue_Hami_Aksu_Railway_desc:0 "荒弃的哈密-阿克苏铁路标志着盛世才执政期的辉煌与失败——这项雄心勃勃的计划始于五十年代，却最终因腐败耗尽了资金，留下了数百公里长的烂尾铁轨，海量欠债，与彻底崩塌的政府信用。随着苏区政权的稳固，我们可以接手这项工程，疏通新疆的东西命脉。"
 COX_Rec_Urumqi_Hami_Railway:0 "修建乌鲁木齐-哈密铁路"
 COX_Rec_Urumqi_Hami_Railway_desc:0 "随着战后中原难民的西迁与经济的恢复，曾经人口稀少的哈密地区成为了新疆与中原经济往来的枢纽。将北疆的两座重要城市经由铁路彼此相连，不仅有利于两地发展，更将为军队的快速部署开辟条件。"
 COX_Rec_Link_Southern_Xinjiang:0 "链接南疆"
 COX_Rec_Link_Southern_Xinjiang_desc:0 "千年以来，南疆与北疆的交往被塔克拉玛干沙漠的天堑所阻隔，演化出来灿烂却迥异的文化，也埋下了分裂的种子。新生的苏区暂时并不具备彻底用铁路联通南北疆的资源，但也可以翻修各地本就存在的乡道与驿站，将它们彼此连接，成为南北交流的新动脉。"
 COX_Rec_Resettle_Border_Refugees:0 "再安置边境难民"
 COX_Rec_Resettle_Border_Refugees_desc:0 "苏区在东疆发动的土改改善了难民们的处境，但必须要承认的是，东疆的自然条件恶劣，并不是所有农民都分到了土地，也并不是所有土地都能得到充分灌溉。在时局稍安后，我们可以组织大规模再安置，将他们送往更宜居的地方，开始新生活。"
 COX_Rec_Promote_Internal_Trade:0 "推动省内贸易"
 COX_Rec_Promote_Internal_Trade_desc:0 "新疆的农村在土改后得以重新焕发生机，各地有了更多盈余，原本的乡道因此变得捉襟见肘；与此同时，乌鲁木齐的手工业也得到恢复。随着两端铁路的建设与南北疆交通路线的开辟，我们可以推动省内贸易的发展，这将对整个新疆产生深远影响。"
 COX_Rec_Technician_Training:0 "技工培训"
 COX_Rec_Technician_Training_desc:0 "随着布里亚特的援助而来的，还有几位自愿前来的工程师。这些同志们的经验，将协助我们的技工熟悉前苏联设备的脾气。借用这些苏联同志的智慧，我们可以组织工人夜校，编纂标准化生产手册，一举将新疆拽出中世纪的行会制……假以时日，新疆苏区将拥有一支庞大的产业工人队伍，成为未来工业化的脊梁。"
 COX_Rec_Yamasu_Iron_Mine:0 "发掘雅满苏铁矿"
 COX_Rec_Yamasu_Iron_Mine_desc:0 "在50年代，盛世才从日本高价聘请的勘探队就于哈密地区发现了一片高品质磁铁矿，埋深很浅，不少铁矿直接裸露在地表。但一如盛世才时期许多没头没尾的政策，在迪化的觥筹交错结束后，这份评估就被束之高阁，直到被苏区在尘封的档案柜中寻得。我们可以在那里建设采矿营地和简易选矿厂，让这里成为新疆未来工业化的基础。"
 COX_Rec_Sino_Soviet_Friendship_Steelworks:0 "建立中苏友谊铁厂"
 COX_Rec_Sino_Soviet_Friendship_Steelworks_desc:0 "盛世才时代并不注重重工业的发展，除了乌鲁木齐附近有几个土焦化厂外，整个新疆并没有任何钢铁行业了。布里亚特的第一批援助中包括了大型卷扬机与鼓风机等关键部件，使得我们终于可以筹建新疆的第一座高炉了。"
 COX_Rec_Renovate_Dihua_Cement_Plant:0 "翻新迪化洋灰厂"
 COX_Rec_Renovate_Dihua_Cement_Plant_desc:0 "在迪化城市扩张的黄金时代，涌现了许多成本低廉的石灰窑。这些企业大都在盛世才执政末期的动荡时期倒闭，并在土改期间得到部分重组。随着新疆的建设如火如荼地展开，我们应当对这些老旧的设施进行筛选——关停低效的，改造尚且能使用的，为接下来的建设提供足够的原料。"
 COX_Rec_Reorganize_Dihua_Arsenal:0 "重组新疆兵工厂"
 COX_Rec_Reorganize_Dihua_Arsenal_desc:0 "“新疆兵工厂”的历史可追溯到1898年，尽管在盛世才时期规模有所扩大，但除去能进行军械维修，子弹复装等简单生产外，只能依靠进口的原材料与部分部件进行简单的组装。布里亚特的援助当中，有冲压机床，铣床等设备，我们可以对新疆兵工厂进行改造，提升其产能，同时展开小批量的枪械仿制。"
 COX_LT_Weihuliang_Power_Plant:0 "苇湖梁火电厂"
 COX_LT_Weihuliang_Power_Plant_desc:0 "旧时代的迪化只有督办公署与几条街亮着电灯，兵工厂的机器还得靠水磨沟的水力带动。苏区接手的机床越来越多，电力却成了瓶颈——布里亚特运来的设备再好，没有电也只是铁疙瘩。我们可以在苇湖梁建起一座火电厂，烧六道湾的煤，让汽轮机昼夜不停，为苏区新生的工业注入澎湃动力。"
 COX_LT_Southern_Xinjiang_Power_Plant:0 "南疆火电厂"
 COX_LT_Southern_Xinjiang_Power_Plant_desc:0 "过去的工业建设从未越过天山，喀什的人口与乌鲁木齐相当，入夜却只能看到星星点点的煤油灯光。土改之后，南疆的棉花与粮食产量得到增加，却因缺乏动力而难以就地加工。我们可以在喀什城郊规划一座小火电厂，就近烧乌恰的煤，先让纺车与水泵转起来，第一次点亮喀什城内的灯。"
 COX_LT_Ili_Hydropower:0 "伊犁水电"
 COX_LT_Ili_Hydropower_desc:0 "伊犁河谷的水力，旧时代只用来推水磨。盛世才治下的伊宁虽有俄侨留下的作坊，却没有一台像样的发电机。河谷落差大、水量稳，正适合建水电——不必烧煤，也不受运煤的牵制。我们可以在伊犁河上筑坝引水，装上布里亚特运来的水轮机与发电机。从此伊宁的机器，靠河水就能转。"
 COX_LT_Kashgar_Cotton_Mill:0 "喀什棉纺厂"
 COX_LT_Kashgar_Cotton_Mill_desc:0 "南疆植棉已有千年，可直到盛世才倒台前，喀什的棉花仍只作为原料外运——本地的土纺车产量不足，还要从外界运来精纺布。土改后，棉花产量见长，我们可以在喀什建起一座现代棉纺厂，将棉花就地纺为布料，不仅能满足本地的需求，还将成为苏区对外出口的招牌。"
 COX_LT_October_Tractor_Plant:0 "十月拖拉机厂"
 COX_LT_October_Tractor_Plant_desc:0 "旧时代的新疆农业完全靠耕牛与人力，地主们将农奴当作牲口使唤，自然没有发展机械化的需要。但随着大量农民得到土地，传统的生产力便难以支持农村日益增长的需要。我们可以在乌鲁木齐筹建拖拉机厂，以维护布里亚特的同志们援助的农业设备，并从中汲取经验，为新疆农业的现代化打好基础。"
 COX_LT_Urumqi_Aluminium_Plant:0 "乌鲁木齐铝厂"
 COX_LT_Urumqi_Aluminium_Plant_desc:0 "新疆没有铝工业，旧政府的兵工厂用铜用铁，铝只能从外面买。铝是飞机的骨架、电线的筋骨，而电解铝最吃电——这正是苇湖梁的电厂要先建起来的原因。氧化铝仍要从苏联运来，电却可以由我们自己发。我们可以在乌鲁木齐建起电解铝厂，让银亮的铝锭第一次出在新疆。"
 COX_LT_Xingxingxia_Tungsten_Mine:0 "开发星星峡钨矿"
 COX_LT_Xingxingxia_Tungsten_Mine_desc:0 "星星峡是甘新之间的咽喉，旧政权的地质队在这里留下过钨矿的记录，却从未动过一锹。钨是硬质合金与弹芯的原料，苏区的军工要自给，就绕不开它。矿脉离公路不远，埋藏也浅。我们可以在这里建起采矿营地与选矿厂，把钨砂一车车运出戈壁。刀具与弹芯，从此有了本地的来路。"
