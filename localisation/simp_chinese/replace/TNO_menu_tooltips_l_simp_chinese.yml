 TNO_ODF_icon_tt: "§R《光自贝加尔湖来》§! §O0.3版本§!——§w故土§!§x新花§!"
 TNO_ODF_icon_tt_delayed: "§w“千磨万击还坚劲，任尔东西南北风。”§!\n\n§q一百年前的《塔尔巴哈台条约》与《伊犁条约》§!，曾用§g冰冷的墨水§!割裂了§i新疆§!这片古老的土地。§g帝俄的哥萨克骑兵§!、§q旧军阀的马鞭§!、以及§e侵略者的刺刀§!，曾轮番在这片广袤的荒漠与绿洲上践踏。千百年来，这里的土地只属于§e剥削者的皮鞭§!，属于高高在上的§q巴依老爷和地主§!，而生活在最底层的§i农奴与贫苦大众§!，只能在漫长的黑夜里默默忍受，在无声中被淹没，在§e罪恶§!滋扰下将诅咒咽进喉咙。\n\n然而，正如§g第二次世界大战的硝烟§!彻底颠覆了全球的秩序，在这片被遗忘的西北边陲，一团自§M贝加尔湖畔§!燃起的§x赤色火种§!，正在向着§q黑暗腐朽的旧世界§!发起最决绝的冲锋。\n\n放眼今日之§i新疆§!，§G土地改革§!正在以一种前所未有的§Y雷霆万钧§!之势席卷千家万户。这不仅是一场§O翻天覆地§!的大事变，更是一场触及社会变革的§x阶级斗争§!。在轰轰烈烈的土改洪流中，广袤土地上的每一个村落、每一座绿洲发生的故事都成为了推动历史滚滚向前的车轮。§G新生的政权§!正以对这千百年的压迫和剥削最深刻的回答，在§q废墟与阵痛§!中重塑这片§w故土§!。\n\n六十年代的西北风暴已经呼啸而来。这株在§q绝望深渊§!中孕育的§x“新花”§!，绝不是开在偏安一隅的温室里，而是开在横跨数千公里、历经§e九死一生§!的§O新长征§!足迹之上。当那支§i衣衫褴褛§!却§Y目光坚定§!的队伍最终在§M乌鲁木齐§!的地平线上出现时，这片历经千劫的古老故土相信，§G中国人民§!终将挣脱枷锁，§G中华民族§!终将以§x独立的姿态§!屹立于世界民族之林。\n\n§e别了西宁，拉动枪栓。§!\n\n§w待到山花烂漫时，她在丛中笑。§!"
