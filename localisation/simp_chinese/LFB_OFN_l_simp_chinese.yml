 LFB_OFN.1.t:0 "粥多僧少，粥少僧多"
 LFB_OFN.1.d:0 "“包瑞德先生，久仰。”两位耄耋之年的老人亲切地握手，孙科想表现得更热情一些，看起来反而有些不自然。\n\n包瑞德没有在意，热情地说：“我在中国住了很多年，见过那么多人，却偏偏没有和您见面，真是惭愧。”\n\n“哪里，我不过是一个为中国奔走的普通人。”\n\n二人坐下，包瑞德说：“二十年前，我离开中国前去的最后一个地方是延安，那时红军领袖是毛泽东。没想到二十多年过去，他的儿子还在领导红军。”\n\n“每个中华儿女都愿意为自由代代奋斗下去，毛先生如是，我父亲也如是。”孙科微笑着说：“我相信美国人民是最能理解我们的。”\n\n“那是自然，美国人民自战前就一直关注着你们，尤其是总统先生。”包瑞德说道：“请您放心，我此刻并非在代表个人和您谈话。即使您不主动会面，我也很快会联系你们。”\n\n“那真是万分荣幸。”孙科长出一口气：“中国人民永远不会忘记美国对抗战的……”\n\n“但是，总统先生也需要您理解。”包瑞德话锋一转：“现在正是中期选举时期，而美国政府已经卷入太多海外冲突。单是海地和南非便将OFN的对外援助消耗大半，不久后可能还要在英吉利海峡对抗德国人。我们没有余力投入到另一场‘西俄战争’。”\n\n“那真是……”\n\n“您也不用这么沮丧。”包瑞德笑了笑：“虽然OFN的援助能力有限，但美国人民依然支持。NPP的报纸每隔半个月就有一篇痛惜杜威政府援助抗战不力的文章，总统先生认为眼下完全可以达成一个双赢的局面。”\n\n“您的意思是？”\n\n“印度统一战争结束后，一部分南亚的OFN志愿军尚未撤回。总统先生会安排他们入滇援助贵军，同时，我们会协助您在美国各州举行抗日募捐，提供您所需要的一切帮助。相信您一定会被美国人民的热情感动到。作为回报，总统先生希望在媒体前感谢他为援助中国做出的贡献。”\n\n“这完全不是问题。”孙科连连点头：“再次感谢您和总统先生为中国人民所做的一切。”\n\n“不用客气，代我向抗争的中国人民问好。”"
 LFB_OFN.1.a:0 "感谢美国人民的援助。"
 LFB_OFN.1.tt_win:0 "§G由于OFN在印度的进展，我们将获得更多支援！§!"
 LFB_OFN.1.tt_lose:0 "§Y由于OFN在印度战线失利，我们只能争取到这么多了！§!"

 LFB_OFN.2.t:0 "最好的南京"
 LFB_OFN.2.d:0 "“治平，看，前面就是南京。”孙科透过宽大的舷窗望向地面说：“这是你出生以来，第一次到南京吧。”\n\n孙治平问：“父亲，您离开这么多年了，还能认出南京吗？”\n\n“看那儿。”孙科指着远处的机场说：“当年朱元璋定都在南京，在那儿修建了明故宫，是当时全世界最大的宫殿。靖难之变后首都迁到了北京，南京又经历了几次战火，慢慢荒废了下来。直到民国十六年才被改造成了机场。”\n\n孙治平有些意外：“您记的这么清楚？”\n\n孙科拄着手杖笑着说：“四十年前，我在这里主持南京的现代化改造，五湖四海的设计师汇聚一堂，想把南京改造成世界一流的现代化城市。”\n\n“那时侵华战争尚未爆发，我们很多人都在畅想未来：机场、铁路、电网、自来水，连一点最微小的设计都需要研究很久……”孙科长叹一口气：“后来我离开了南京，首都改造的计划就这样搁置了下来。没想到后来，陈公博还是采用了我的建设计划，让我能以这样的方式看到曾经想象中的南京……”\n\n“父亲，这说明您的设计很好啊。”\n\n孙科笑着摇了摇头说：“治平，其实当年计划定都时，很多人都反对定都在南京，是你祖父力排众议，决定定都南京。”\n\n“嗯，听说过一些。”\n\n“在设计之初，我也不明白为什么要定在这里。军事上看，南京有天险而无纵深，一旦丢失长江或沿海就极易失守；政治上看，这里对各地边疆都控制极弱，极易产生割据政权……”孙科顿了顿，说：“历史上定都南京的政权都不过百年，无论是北京还是西安，都比南京更有价值。”\n\n“……父亲。”\n\n“其实我也知道，无论你祖父还是蒋中正，在定都时考虑的都更多是现实因素。国民革命自诞生以来就没有多少留给理想……但我还是想找到一个属于我自己的答案，属于南京的答案。”\n\n“那您后来找到了吗？”\n\n孙科没有回答，他只是再次侧目望向窗外，看看脚下的城市，缓缓说道。\n\n“自鸦片战争以来，中华民族饱受压迫，封建帝制、国家分裂、外敌入侵。持续了上百年。而南京见证了中国的第一个不平等条约，见证了太平天国和辛亥革命，见证了两次抗日战争，见证了中华民族的解放。”\n\n孙科看向孙治平：“我想，她或许不是最好的首都，但她和中国人民走过了近代的每一次苦难和斗争，是陪伴中华民族最久的首都。”\n\n我奉圣人起南国，祸乱初平事休息。\n从今四海永为家，不用长江限南北。"
 LFB_OFN.2.a:0 "欢迎回家。"
 LFB_OFN.2.tt:0 "£LFB_chinese_texticon §v浪子终于回到了祖国大地，大洋彼岸的哥伦比亚特区流亡政府将会被解散！§!"

 COX_OFN_support:0 "OFN支援"
 COX_OFN_support_desc:0 "OFN的援助船队终于抵达了中国的港口。从加利福尼亚运来的装甲运兵车、成箱的步枪与药品，以及那些自愿穿上中国军装的美国青年，正沿着滇缅公路与驼峰航线源源不断地涌入。\n\n华盛顿或许吝啬，或许犹豫，但美国人民没有忘记我们。有了这份支援，我们终将把侵略者赶出家园。"
