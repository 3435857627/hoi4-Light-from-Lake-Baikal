 COX_Rec_Continue_Hami_Aksu_Railway:0 "继续哈密-阿克苏铁路"
 COX_Rec_Continue_Hami_Aksu_Railway_desc:0 "铁轨沿着天山南麓一路向西铺去，哈密的矿石与阿克苏的粮棉第一次被同一条线串了起来。汽笛响起时，戈壁不再只是路过的地方。"
 COX_Rec_Urumqi_Hami_Railway:0 "修建乌鲁木齐-哈密铁路"
 COX_Rec_Urumqi_Hami_Railway_desc:0 "东去的铁轨从迪化直抵哈密，把首府与东大门连成一体。商旅与军需都改走这条线，驼队渐渐少了。"
 COX_Rec_Link_Southern_Xinjiang:0 "链接南疆"
 COX_Rec_Link_Southern_Xinjiang_desc:0 "阿克苏与喀什之间的道路被拓宽加固，沿途的桥梁、驿站与渠埂一并整修。南疆的城镇不再彼此隔绝，粮棉与货物得以在绿洲之间往来。"
 COX_Rec_Resettle_Border_Refugees:0 "再安置边境难民"
 COX_Rec_Resettle_Border_Refugees_desc:0 "边境的难民被安置到北疆与南疆的城镇，荒地上立起了新的院落与渠埂。人来了，路和渠也跟着修了起来。"
 COX_Rec_Promote_Internal_Trade:0 "推动省内贸易"
 COX_Rec_Promote_Internal_Trade_desc:0 "关卡与旧厘金撤去，商队不必再绕远路。焉耆的粮、哈密的铁、伊犁的皮毛在省内流转，市集重新热闹起来。"
 COX_Rec_Technician_Training:0 "技工培训"
 COX_Rec_Technician_Training_desc:0 "工人白天在车间，晚上在夜校识字、看图、学算料。手上有了准头，机器才肯听话。"
 COX_Rec_Yamasu_Iron_Mine:0 "发掘雅满苏铁矿"
 COX_Rec_Yamasu_Iron_Mine_desc:0 "雅满苏的矿脉在戈壁上被揭开，矿石沿着新修的公路运往迪化。高炉终于不必再等米下锅。"
 COX_Rec_Sino_Soviet_Friendship_Steelworks:0 "建立中苏友谊铁厂"
 COX_Rec_Sino_Soviet_Friendship_Steelworks_desc:0 "布里亚特运来的机床在西大桥边转了起来，第一炉钢水映红了半个厂区。新疆的钢铁从此不再只靠旧时代的残渣。"
 COX_Rec_Renovate_Dihua_Cement_Plant:0 "翻新迪化洋灰厂"
 COX_Rec_Renovate_Dihua_Cement_Plant_desc:0 "洋灰厂的窑重新烧了起来，粉尘与蒸汽笼罩着厂区。城里每一处新起的墙，都掺着这里的灰。"
 COX_Rec_Reorganize_Dihua_Arsenal:0 "重组迪化兵工厂"
 COX_Rec_Reorganize_Dihua_Arsenal_desc:0 "兵工厂的机床重新排列，工人按新的工序分工。枪管、弹壳与零件从流水线上下来，不再是修修补补的旧活。"
 COX_LT_Weihuliang_Power_Plant:0 "苇湖梁火电厂"
 COX_LT_Weihuliang_Power_Plant_desc:0 "苇湖梁的烟囱冒起白烟，迪化的夜里第一次有了成片的灯火。工厂不必再跟着天黑停工。"
 COX_LT_Southern_Xinjiang_Power_Plant:0 "南疆火电厂"
 COX_LT_Southern_Xinjiang_Power_Plant_desc:0 "喀什城外的电厂点火，机杼与水泵一起转了起来。南疆的夜不再只剩星光。"
 COX_LT_Ili_Hydropower:0 "伊犁水电"
 COX_LT_Ili_Hydropower_desc:0 "伊犁河被拦起一道坝，水流推动轮机，电顺着线路进了城。河谷里的机器第一次不靠烧煤也能转。"
 COX_LT_Kashgar_Cotton_Mill:0 "喀什棉纺厂"
 COX_LT_Kashgar_Cotton_Mill_desc:0 "喀什的棉花不再只往外运，纺锭在厂房里转起来，布匹从南疆的织机上下线。"
 COX_LT_October_Tractor_Plant:0 "十月拖拉机厂"
 COX_LT_October_Tractor_Plant_desc:0 "拖拉机从厂房里开出来，第一次驶进附近的农场。铁牛替下了耕牛，田里的活计快了许多。"
 COX_LT_Urumqi_Aluminium_Plant:0 "乌鲁木齐铝厂"
 COX_LT_Urumqi_Aluminium_Plant_desc:0 "从外地运来的氧化铝在电解槽里化成银亮的铝锭，城里的电线与飞机零件有了着落。"
 COX_LT_Xingxingxia_Tungsten_Mine:0 "开发星星峡钨矿"
 COX_LT_Xingxingxia_Tungsten_Mine_desc:0 "星星峡的矿石被一车车运出戈壁，钨砂在选矿厂里分出品位。硬质的刀具与弹芯，从此有了本地的来路。"
