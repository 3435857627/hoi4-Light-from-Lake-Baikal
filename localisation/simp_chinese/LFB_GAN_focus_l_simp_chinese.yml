l_simp_chinese:

 GAN_Seal_From_The_West:0 "捧印西来"
 GAN_Seal_From_The_West_desc:0 "委任状是南京的纸，印是南京的铜。张岚峰双手接了，回头对副官说：备酒。副官问，请谁？他说，先备着。"
 GAN_Be_Prepared:0 "有备无患"
 GAN_Be_Prepared_desc:0 "他在公署后院挖了一个地窖：粮、枪、电台、两箱银元。副官问，防谁？他说，防到时候。"
 GAN_Old_Day_Spirits:0 "旧日魂灵"
 GAN_Old_Day_Spirits_desc:0 "夜里他一个人翻旧账，看二十年前豫东的收烟册子。册子上的字是他自己写的，一笔一划，比现在公署的公文好看得多。"
 GAN_Three_Camps:0 "三本营帐假乱真"
 GAN_Three_Camps_desc:0 "一个营备三本名册，这是老手艺。点验官来了看第一本，走了烧第二本，第三本留给下一任——下一任也用得上。"
 GAN_Northwest_Golden_Crow:0 "西北金乌"
 GAN_Northwest_Golden_Crow_desc:0 "太阳照在兰州城头，也照在柘城老宅的屋脊上。他站在城墙上想，这地方跟他，谁也不欠谁。"
 GAN_Army_From_Tokyo:0 "大军自东京来"
 GAN_Army_From_Tokyo_desc:0 "东京终于点了头。军列一列接一列开进兰州站，卸下炮、马、和一批说日语的新面孔。辻政信在月台上数车厢，数到第七列的时候，他笑了——这些兵，是给他一个人的。"
 GAN_Administration_Misrule:0 "公署误国"
 GAN_Administration_Misrule_desc:0 "辻政信把公署三年的公文摊在桌上，一页一页看。剿共的捷报、清乡的呈文、各县的征粮表——每一页都写得漂亮，每一页都是假的。他合上卷宗：这样的公署，办的是谁的事？"
 GAN_Conscript_Labor_And_Fortify:0 "征夫筑城"
 GAN_Conscript_Labor_And_Fortify_desc:0 "兰州城外，民夫排成长龙，把从满洲运来的钢筋水泥一筐一筐背上城墙。土冻得比铁硬，一镐下去只崩一个白点。辻政信说，帝国不缺人，缺的是肯干活的人。"
 GAN_Under_The_Scorching_Sun:0 "旭日之下"
 GAN_Under_The_Scorching_Sun_desc:0 "太阳旗一格一格爬上兰州城头。辻政信站在城墙上看着，城下的老百姓低着头，没有一个人抬头。他说，这样也好，看多了就习惯了。"
 GAN_No_Grass_Grows:0 "寸草不生"
 GAN_No_Grass_Grows_desc:0 "凡是给游击队送过粮的村子，一律烧掉；凡是藏过枪的山沟，一律搜三遍。参谋问了一句：那老百姓呢？辻政信没回答，只是把地图上那一带画了个圈。"
