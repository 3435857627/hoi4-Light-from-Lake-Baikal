 #新闻
 LFB_GAN_news.1.t:0 "[Get_newspaper_header]南京宣布恢复甘肃省主权"
 LFB_GAN_news.1.d:0 "就在昨日，悬挂多年的日本军旗终于从中山桥头降下。据悉，日本驻华大使与国民政府亚洲司司长薛蓬元签署了《关于移交甘肃省军政之备忘录》，西北方面军五万余人即日开拔东返，驻拱星墩机场的航空队上周已转场包头。签署当天，司令官辻政信称病未到。这次撤退似乎是一件可以预见的事情；在冷战中焦头烂额的日方早已无力维持一支没有战果的庞大军队。\n\n而南京方面则称这是“主权之回归”，《中华日报》的社论把它与一九四三年交还租界并列，算作和平建国的又一项成果。"
 LFB_GAN_news.1.a:0 "东洋鬼子握不住他的刀把了。"
