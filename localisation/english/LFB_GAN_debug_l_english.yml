 # News
 LFB_GAN_news.1.t:0 "[Get_newspaper_header]Nanjing Declares the Restoration of Gansu's Sovereignty"
 LFB_GAN_news.1.d:0 "Only yesterday, the Japanese army flag that had hung at the head of the Zhongshan Bridge for years finally came down. According to reports, the Japanese ambassador to China and Xue Pengyuan, head of the Asian Department of the National Government, signed the Memorandum on the Transfer of Civil and Military Administration in Gansu Province. The more than fifty thousand men of the Northwestern Area Army are to march east at once, while the air unit at Gongxingdun airfield was already flown out to Baotou last week. The commander, Tsuji Masanobu, pleaded illness and did not attend the signing. The withdrawal had long been foreseeable; the Japanese, hard pressed in the Cold War, have no strength left for a vast army that has won no victories.\n\nNanjing, for its part, calls it \"the return of sovereignty\". The editorial in Zhonghua Ribao ranks it alongside the return of the concessions in 1943, and counts it as another achievement of Peaceful National Construction."
 LFB_GAN_news.1.a:0 "The Eastern Devils can no longer hold their knives."
