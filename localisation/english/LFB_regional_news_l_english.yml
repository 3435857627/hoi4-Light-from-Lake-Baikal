l_english:

 LFB_COX_Africa_Checkbox_ticked_tt:0 "§F§Jthe Dark Continent§!§F still labours under the boot, and every cry there answers ours.§!"
 LFB_COX_Africa_Checkbox_unticked_tt:0 "§FAcross the Saharan sands, the cries of §Jthe Dark Continent§!§F sound very far away.§!"
 LFB_COX_America_Checkbox_ticked_tt:0 "§F§mthe New World§!§F is struck with sparks; on the far side of the world, the tide may yet turn.§!"
 LFB_COX_America_Checkbox_unticked_tt:0 "§FEnough of these playground revolutions in §mthe New World§!§F.§!"
 LFB_COX_Antarctica_Checkbox_ticked_tt:0 "§FThe scramble for §qthe Ice Continent§!§F is absurd and real; the world's end is betting on the future too.§!"
 LFB_COX_Antarctica_Checkbox_unticked_tt:0 "§F§qthe Ice Continent§!§F holds only ice, penguins, and the ambitions of a few madmen.§!"
 LFB_COX_Asia_Checkbox_tt:0 "§FEven the whispers of §Renemies and collaborators§!§F cannot escape our ears.§!"
 LFB_COX_Europe_Checkbox_tt:0 "§F§RComrades of the North§!§F, will you break these chains with us?§!"
 LFB_COX_Oceania_Checkbox_ticked_tt:0 "§FAcross §<the Sea of Islands§!§F the old empire is ebbing; the next tide has yet to take shape.§!"
 LFB_COX_Oceania_Checkbox_unticked_tt:0 "§FAcross the ocean, we cannot even pronounce the names of the islands in §<the Sea of Islands§!§F.§!"
 LFB_XBJ_Africa_Checkbox_ticked_tt:0 "§FThe colonial chains are loosening over §Jthe Dark Continent§!§F; a pity our hands cannot reach that far.§!"
 LFB_XBJ_Africa_Checkbox_unticked_tt:0 "§FThe accounts of §Jthe Dark Continent§!§F are kept in someone else's ledger.§!"
 LFB_XBJ_America_Checkbox_ticked_tt:0 "§FEvery election in §mthe New World§!§F becomes a rifle on our border a few years later.§!"
 LFB_XBJ_America_Checkbox_unticked_tt:0 "§FA game played across the whole ocean against §mthe New World§!§F need not be copied out line by line.§!"
 LFB_XBJ_Antarctica_Checkbox_ticked_tt:0 "§FThere are flags on the stations of §qthe Ice Continent§!§F too, and money behind the flags.§!"
 LFB_XBJ_Antarctica_Checkbox_unticked_tt:0 "§FThere is nothing under §qthe Ice Continent§!§F that we need.§!"
 LFB_XBJ_Asia_Checkbox_tt:0 "§FThe §bMa clique's§!§F turmoil is unquiet, and the §bJapanese army in the Northwest§!§F has already reached our gate. Not one page of either file may be skipped.§!"
 LFB_XBJ_Europe_Checkbox_ticked_tt:0 "§FEvery cable from §bEurope§!§F belongs in the archive; it decides how long we can still breathe.§!"
 LFB_XBJ_Europe_Checkbox_unticked_tt:0 "§F§bEurope§!§F is far. Finish the business in Lanzhou first.§!"
 LFB_XBJ_Oceania_Checkbox_ticked_tt:0 "§F§<the Sea of Islands§!§F is Japan's backyard, and also the rope around her neck.§!"
 LFB_XBJ_Oceania_Checkbox_unticked_tt:0 "§F§<the Sea of Islands§!§F is far; our maps still show only this corner of the Northwest.§!"
