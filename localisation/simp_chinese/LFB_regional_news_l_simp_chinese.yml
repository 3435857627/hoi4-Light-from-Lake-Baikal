l_simp_chinese:

 LFB_COX_Africa_Checkbox_ticked_tt:0 "§F§J黑色大陆§!§F仍在铁蹄下喘息，那里的每一声呐喊都与我们同频。§!"
 LFB_COX_Africa_Checkbox_unticked_tt:0 "§F隔着撒哈拉的风沙，§J黑色大陆§!§F的哭声听起来太远了。§!"
 LFB_COX_America_Checkbox_ticked_tt:0 "§F§m新大陆§!§F星火点点，地球的另一端，转机亦可能蕴藏其中。§!"
 LFB_COX_America_Checkbox_unticked_tt:0 "§F算了吧，§m新大陆§!§F这种过家家一般的所谓革命。§!"
 LFB_COX_Antarctica_Checkbox_ticked_tt:0 "§F§q冰封大陆§!§F上的争夺荒诞却真实，世界的尽头也在为未来下注。§!"
 LFB_COX_Antarctica_Checkbox_unticked_tt:0 "§F§q冰封大陆§!§F上只有冰、企鹅，和几个疯子的野心。§!"
 LFB_COX_Asia_Checkbox_tt:0 "§F即使是§R敌人与汉奸§!§F的窃窃私语，也逃不过我们的耳朵。§!"
 LFB_COX_Europe_Checkbox_tt:0 "§F§R北方的同志们§!§F啊，是否准备与我们一同挣开枷锁？§!"
 LFB_COX_Oceania_Checkbox_ticked_tt:0 "§F§<万岛之海§!§F上旧帝国正在退潮，新的浪头还没成形，那片群岛迟早要换一面旗。§!"
 LFB_COX_Oceania_Checkbox_unticked_tt:0 "§F隔着大洋，§<万岛之海§!§F那些岛屿的名字我们甚至念不全。§!"
 LFB_XBJ_Africa_Checkbox_ticked_tt:0 "§F§J黑色大陆§!§F的锁链正在松动，可惜我们的手还伸不了那么长。§!"
 LFB_XBJ_Africa_Checkbox_unticked_tt:0 "§F§J黑色大陆§!§F的账，记在别人的本子上。§!"
 LFB_XBJ_America_Checkbox_ticked_tt:0 "§F§m新大陆§!§F的每一次选举，若干年后都会变成边境上的一支枪。§!"
 LFB_XBJ_America_Checkbox_unticked_tt:0 "§F隔着整个大洋，§m新大陆§!§F的博弈暂时不必逐条抄录。§!"
 LFB_XBJ_Antarctica_Checkbox_ticked_tt:0 "§F§q冰封大陆§!§F上的考察站也插着旗子，旗子背后是钱。§!"
 LFB_XBJ_Antarctica_Checkbox_unticked_tt:0 "§F§q冰封大陆§!§F之下没有我们要的东西。§!"
 LFB_XBJ_Asia_Checkbox_tt:0 "§F§b马家军§!§F的乱局未平，§b西北日军§!§F的刺刀又已抵到门口，这两本卷宗我们一页都不能漏看。§!"
 LFB_XBJ_Europe_Checkbox_ticked_tt:0 "§F§b欧洲§!§F的每一封电报都值得归档，那里决定着我们还能喘息多久。§!"
 LFB_XBJ_Europe_Checkbox_unticked_tt:0 "§F§b欧洲§!§F太远。先把兰州的事办完。§!"
 LFB_XBJ_Oceania_Checkbox_ticked_tt:0 "§F§<万岛之海§!§F既是日本人的后院，也是套在他们脖子上的绳索。§!"
 LFB_XBJ_Oceania_Checkbox_unticked_tt:0 "§F§<万岛之海§!§F太远，我们的地图上还只有西北这一角。§!"
